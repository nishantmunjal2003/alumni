services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/nishantmunjal2003/alumni:latest
    container_name: alumni_app
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: base64:your_app_key_here
      APP_URL: http://localhost:8080
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: alumni_portal
      DB_USERNAME: alumni_user
      DB_PASSWORD: alumni_secret_password
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - app_storage:/var/www/html/storage

  db:
    image: mysql:8.0
    container_name: alumni_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: alumni_portal
      MYSQL_USER: alumni_user
      MYSQL_PASSWORD: alumni_secret_password
      MYSQL_ROOT_PASSWORD: root_secret_password
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "alumni_user", "-palumni_secret_password"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  app_storage:
  db_data:
